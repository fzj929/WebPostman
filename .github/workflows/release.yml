name: Build portable release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v1.0)
        required: true
        default: v1.0
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 portable
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Validate version tag
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$') {
            throw 'Expected a version tag such as v1.0 or v1.0.1.'
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: WebPostman.Web/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build frontend
        working-directory: WebPostman.Web
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish with bundled .NET runtime
        run: |
          dotnet publish WebPostman.Api/WebPostman.Api.csproj -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o dist/WebPostman
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add launcher and instructions
        run: |
          @'
          @echo off
          cd /d "%~dp0"
          echo WebPostman: http://127.0.0.1:5078
          echo Keep this window open. Press Ctrl+C to stop.
          start "" "http://127.0.0.1:5078"
          WebPostman.Api.exe
          pause
          '@ | Set-Content dist/WebPostman/Start-WebPostman.cmd -Encoding ascii
          @'
          WebPostman - Windows x64 portable edition

          1. Extract the entire ZIP to a writable folder.
          2. Double-click Start-WebPostman.cmd.
          3. Open http://127.0.0.1:5078 (refresh if the server is still starting).
          4. Keep the console open; press Ctrl+C to stop.

          Node.js and .NET do not need to be installed.
          Server data is stored in App_Data. Back up the entire directory before updating.
          Account-enabled versions keep anonymous workspaces only in the browser.
          To update, stop the app and extract the new version without deleting App_Data.

          Optional Windows service (administrator PowerShell):
            .\scripts\install-service.ps1
          '@ | Set-Content dist/WebPostman/READ-ME.txt -Encoding ascii
          Copy-Item LICENSE dist/WebPostman/LICENSE

      - name: Smoke test packaged application
        run: |
          $publish = (Resolve-Path dist/WebPostman).Path
          $env:WebPostman__ListenUrl = 'http://127.0.0.1:15078'
          $env:WebPostman__DataDirectory = Join-Path $env:RUNNER_TEMP 'webpostman-smoke'
          $app = Start-Process -FilePath "$publish/WebPostman.Api.exe" -WorkingDirectory $publish -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP/webpostman-out.log" -RedirectStandardError "$env:RUNNER_TEMP/webpostman-err.log"
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($app.HasExited) { throw 'Packaged application exited before startup.' }
              try {
                $page = Invoke-WebRequest http://127.0.0.1:15078/ -TimeoutSec 2
                if ($page.Content -match '<title>WebPostman') { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Packaged frontend did not become ready.' }
            if (Test-Path WebPostman.Api/Accounts.cs) {
              $session = Invoke-RestMethod http://127.0.0.1:15078/api/auth/me -TimeoutSec 5
              if (-not ($session.PSObject.Properties.Name -contains 'user')) { throw 'Session API response is invalid.' }
              $private = Invoke-WebRequest http://127.0.0.1:15078/api/workspace -SkipHttpErrorCheck -TimeoutSec 5
              if ($private.StatusCode -ne 401) { throw 'Anonymous workspace access must be rejected.' }
              if (-not (Test-Path "$env:WebPostman__DataDirectory/accounts.db")) { throw 'Accounts database was not created.' }
            } else {
              $workspace = Invoke-RestMethod http://127.0.0.1:15078/api/workspace -TimeoutSec 5
              if ($null -eq $workspace.collections) { throw 'Workspace API response is invalid.' }
              if (-not (Test-Path "$env:WebPostman__DataDirectory/workspace.db")) { throw 'SQLite database was not created.' }
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            Get-Content "$env:RUNNER_TEMP/webpostman-out.log", "$env:RUNNER_TEMP/webpostman-err.log" -ErrorAction SilentlyContinue
          }

      - name: Create ZIP and checksum
        run: |
          $archive = "WebPostman-$env:RELEASE_TAG-win-x64.zip"
          Compress-Archive -Path dist/WebPostman -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: WebPostman-${{ env.RELEASE_TAG }}-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 portable
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      # Use the installer shipped with this workflow, including when rebuilding old tags.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts/install-service.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate version tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]] || {
            echo 'Expected a version tag such as v1.0 or v1.0.1.' >&2
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: WebPostman.Web/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build frontend
        working-directory: WebPostman.Web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Publish with bundled .NET runtime
        run: |
          dotnet publish WebPostman.Api/WebPostman.Api.csproj -c Release -r linux-x64 --self-contained true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o dist/WebPostman

      - name: Add launcher and instructions
        run: |
          cat > dist/WebPostman/start-webpostman.sh <<'LAUNCHER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          cd -- "$(dirname -- "$(readlink -f -- "${BASH_SOURCE[0]}")")"
          echo 'WebPostman: http://127.0.0.1:5078'
          echo 'Press Ctrl+C to stop.'
          exec ./WebPostman.Api "$@"
          LAUNCHER
          cat > dist/WebPostman/READ-ME.txt <<'INSTRUCTIONS'
          WebPostman - Linux x64 portable edition

          Extract the entire archive to a writable folder and run:
            cd WebPostman
            ./start-webpostman.sh
          Open http://127.0.0.1:5078 in your browser. Press Ctrl+C to stop.

          Includes the frontend and .NET runtime. No Node.js or .NET installation required.
          Requires a glibc-based x64 Linux distribution with .NET 8 native dependencies
          (including ICU, OpenSSL and zlib); Alpine/musl is not supported by this package.
          Server data: App_Data. Back up the entire directory before updating.
          Account-enabled versions keep anonymous workspaces only in the browser.

          Optional systemd service:
            sudo bash scripts/install-service.sh
          The installer uses the bundled executable and does not require dotnet.
          INSTRUCTIONS
          cp .release-tools/scripts/install-service.sh dist/WebPostman/scripts/install-service.sh
          cp LICENSE dist/WebPostman/LICENSE
          chmod +x dist/WebPostman/WebPostman.Api dist/WebPostman/start-webpostman.sh dist/WebPostman/scripts/*.sh
          bash -n dist/WebPostman/start-webpostman.sh dist/WebPostman/scripts/install-service.sh

      - name: Archive and test extracted application
        run: |
          archive="WebPostman-$RELEASE_TAG-linux-x64.tar.gz"
          tar -czf "dist/$archive" -C dist WebPostman
          (cd dist && sha256sum "$archive" > SHA256SUMS-linux-x64.txt)
          test_dir="$(mktemp -d)"
          tar -xzf "dist/$archive" -C "$test_dir"
          export WebPostman__ListenUrl=http://127.0.0.1:15078
          export WebPostman__DataDirectory="$test_dir/data"
          # Exercise the actual launcher from outside the application directory.
          "$test_dir/WebPostman/start-webpostman.sh" > "$test_dir/app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true; cat "$test_dir/app.log"' EXIT
          ready=false
          for attempt in {1..30}; do
            kill -0 "$app_pid" || { echo 'Application exited before startup.' >&2; exit 1; }
            if curl -fsS http://127.0.0.1:15078/ -o "$test_dir/index.html" && grep -q '<title>WebPostman' "$test_dir/index.html"; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]] || { echo 'Packaged frontend did not become ready.' >&2; exit 1; }
          if [[ -f WebPostman.Api/Accounts.cs ]]; then
            curl -fsS http://127.0.0.1:15078/api/auth/me | jq -e 'has("user") and .user == null'
            [[ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:15078/api/workspace)" == 401 ]]
            test -s "$test_dir/data/accounts.db"
          else
            curl -fsS http://127.0.0.1:15078/api/workspace | jq -e '.collections | type == "array"'
            test -s "$test_dir/data/workspace.db"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: WebPostman-${{ env.RELEASE_TAG }}-linux-x64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS-linux-x64.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release downloads
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WebPostman-${{ env.RELEASE_TAG }}-*
          path: dist
          merge-multiple: true

      - name: Verify both packages and combine checksums
        working-directory: dist
        run: |
          sed -i 's/\r$//' SHA256SUMS.txt
          cat SHA256SUMS-linux-x64.txt >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.txt <<'NOTES'
          Portable packages include the frontend and .NET runtime.

          - Windows x64: extract the ZIP and double-click `Start-WebPostman.cmd`.
          - Linux x64 (glibc): extract the tar.gz, then run `cd WebPostman && ./start-webpostman.sh`.

          Open http://127.0.0.1:5078. Server data is stored in `App_Data`; back up the entire directory before updating. Account-enabled versions keep anonymous workspaces only in the browser. SHA256SUMS.txt covers both packages.
          NOTES
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "WebPostman $RELEASE_TAG" --notes-file release-notes.txt
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --notes-file release-notes.txt
