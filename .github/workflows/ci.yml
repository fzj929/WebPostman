name: Regression checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: WebPostman.Web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
        working-directory: WebPostman.Web
      - run: npm run build
        working-directory: WebPostman.Web
      - run: dotnet build WebPostman.Api/WebPostman.Api.csproj -c Release
      - run: node --test tests/frontend.test.mjs tests/api.test.mjs tests/accounts.test.mjs
